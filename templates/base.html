<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fantasy TdF Helper{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .value-excellent { color: #28a745; font-weight: bold; }
        .value-good { color: #17a2b8; }
        .value-average { color: #ffc107; }
        .value-poor { color: #dc3545; }
        .value-unknown { color: #6c757d; }
        
        .rider-card {
            transition: transform 0.2s;
            border-left: 4px solid #007bff;
        }
        
        .rider-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .category-leaders { border-left-color: #dc3545; }
        .category-sprinters { border-left-color: #28a745; }
        .category-climbers { border-left-color: #17a2b8; }
        .category-all-rounders { border-left-color: #ffc107; }
        
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .navbar-brand i {
            color: #ffc107;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-bicycle"></i> Fantasy TdF Helper
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">
                            <i class="fas fa-home"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('riders') }}">
                            <i class="fas fa-users"></i> Riders
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('compare') }}">
                            <i class="fas fa-balance-scale"></i> Compare
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('team_builder') }}">
                            <i class="fas fa-users-cog"></i> Team Builder
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('stats') }}">
                            <i class="fas fa-chart-bar"></i> Statistics
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">
                <i class="fas fa-bicycle"></i> Fantasy TdF Helper 
                | Data from <a href="https://www.procyclingstats.com" target="_blank" class="text-warning">ProCyclingStats</a>
                | Fantasy from <a href="https://fantasybytissot.letour.fr" target="_blank" class="text-warning">Tour de France Fantasy</a>
            </p>
            <small class="text-muted">
                Last data update: Today
            </small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script>
        // Helper functions for JavaScript
        function formatPrice(price) {
            return price + ' credits';
        }
        
        function formatPoints(points) {
            return Math.round(points).toLocaleString();
        }
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
